name: Build instalador de Windows
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Si el tag no coincide con la versión de package.json, el launcher instalado NUNCA ve la actualización.
      - name: Comprobar que el tag coincide con la versión
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then echo "::error::El tag $GITHUB_REF_NAME no coincide con package.json (v$V). Sube la versión en package.json y crea el tag v$V."; exit 1; fi
      # Crea el release ANTES de subir archivos: evita el error 422 already_exists
      # (electron-builder sube el .exe y el .blockmap a la vez y ambos intentan crearlo).
      - name: Crear release si no existe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Instalador propio (interfaz a medida): descarga el instalador oficial de este release y lo ejecuta en silencio.
      - name: Construir y subir el instalador propio
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --projectDir installer --win portable --publish never
          gh release upload "$GITHUB_REF_NAME" installer/dist/Atenas-Client-Instalador.exe --clobber
