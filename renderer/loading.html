<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'">
  <title>Cargando · Atenas Client</title>
  <link rel="stylesheet" href="loading.css">
</head>
<body>
  <main class="stage" id="stage">
    <div class="stars" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <div class="meander" aria-hidden="true"></div>
    <button class="x" id="x" aria-label="Ocultar pantalla de carga" title="Ocultar (Esc)">×</button>

    <section class="center">
      <div class="mark">
        <svg class="ring" viewBox="0 0 160 160" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="80" cy="80" r="72"/>
          <circle class="val" id="val" cx="80" cy="80" r="72" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 80 80)"/>
        </svg>
        <img class="logo" src="../assets/icon.svg" width="96" height="96" alt="">
      </div>
      <h1 id="title">ATENAS</h1>
      <p class="eyebrow" id="eyebrow">C  L  I  E  N  T</p>
      <p class="status" id="status" aria-live="polite">Preparando el juego</p>
      <div class="bar"><i id="fill"></i></div>
      <p class="pct" id="pct">0%</p>
    </section>
    <p class="tip" id="tip"></p>
    <p class="hide-hint">Esc o × para ocultar</p>
  </main>
  <script src="loading.js"></script>
</body>
</html>
