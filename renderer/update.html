<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'">
  <title>Actualización · Atenas Client</title>
  <link rel="stylesheet" href="update.css">
</head>
<body>
  <main class="card" id="card" data-state="downloading">
    <div class="glow"></div>
    <div class="meander" aria-hidden="true"></div>
    <div class="drag"></div>
    <button class="x" id="x" aria-label="Cerrar">×</button>

    <div class="mark">
      <svg class="ring" id="ring" viewBox="0 0 160 160" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="80" cy="80" r="72"/>
        <circle class="val" id="val" cx="80" cy="80" r="72" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 80 80)"/>
      </svg>
      <img class="logo" src="../assets/icon.svg" width="92" height="92" alt="">
      <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>
    </div>

    <p class="eyebrow" id="eyebrow">NUEVA VERSIÓN</p>
    <h1 id="title">Descargando actualización</h1>
    <div class="ver"><span id="cur">—</span><i>→</i><b id="next">—</b></div>
    <p class="status" id="status" aria-live="polite">Preparando…</p>

    <div class="meta" id="meta"><b id="pct">0%</b><span id="speed"></span></div>

    <div class="actions" id="actions" hidden>
      <button class="cta" id="primary">Reiniciar y actualizar</button>
      <button class="ghost" id="secondary">Más tarde</button>
    </div>
    <p class="foot">Atenas Client · por kaspercito</p>
  </main>
  <script src="update.js"></script>
</body>
</html>
